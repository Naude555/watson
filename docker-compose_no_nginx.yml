services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    restart: unless-stopped

  wa-api:
    build: .
    container_name: wa-api
    env_file: .env
    environment:
      WA_AUTO_CLEAR_AUTH_ON_BOOT: "0"
      WA_FORCE_LATEST_WEB_VERSION: "1"
    expose:
      - "3000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    restart: unless-stopped

volumes:
  redis_data:
